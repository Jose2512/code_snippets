# Ultralytics YOLO-pose dataset for horse keypoints.
# Folder structure: <path>/images/{train,val}/*.jpg and <path>/labels/{train,val}/*.txt
path: datasets/horse_pose
train: images/train
val: images/val

names:
  0: horse

# --- Option A: AP-10K layout (17 keypoints, matches --layout ap10k) ---------
kpt_shape: [17, 3]
# L_Eye R_Eye Nose Neck Tail | L_Shoulder L_Elbow L_F_Paw | R_Shoulder R_Elbow R_F_Paw | L_Hip L_Knee L_B_Paw | R_Hip R_Knee R_B_Paw
flip_idx: [1, 0, 2, 3, 4, 8, 9, 10, 5, 6, 7, 14, 15, 16, 11, 12, 13]

# --- Option B: detailed equine layout (configs/horse_detailed_layout.json) ---
# kpt_shape: [27, 3]
# flip_idx: [0, 1, 3, 2, 4, 5, 6, 12, 13, 14, 15, 16, 7, 8, 9, 10, 11, 22, 23, 24, 25, 26, 17, 18, 19, 20, 21]
