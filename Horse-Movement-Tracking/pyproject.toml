[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "horsetrack"
version = "0.1.0"
description = "Track horse leg joints, hooves and head position in video, with or without a rider."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "opencv-python-headless>=4.8", "pandas>=2.0", "scipy>=1.10",
  "matplotlib>=3.7", "onnxruntime>=1.16", "ultralytics>=8.3", "lap>=0.5",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
dev = ["pytest", "torch", "onnx"]

[project.scripts]
horsetrack = "horsetrack.cli:main"

[tool.setuptools]
packages = ["horsetrack", "horsetrack.pose"]
